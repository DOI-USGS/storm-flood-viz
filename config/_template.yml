# Per-storm and viz configuration template.
#
# For a new storm, fill in date_start, date_end, landfall_time,
# storm_info, bbox, and proj. Everything below those (palettes, viz_config,
# anchors) has working defaults and usually does not need to change. 
# See README.md for more details on each config component. 
#
# Copy this file to config/<storm_name>.yml, fill in values, then update
# p0_storm_cfg_file in 0_config.R to point at the new file.
#
# See config/helene.yml for a fully populated example. Times are UTC.

# Storm metadata
date_start: "YYYY-MM-DD"
date_end: "YYYY-MM-DD"
landfall_time: "YYYY-MM-DD HH:MM:SS"   # UTC
# Optional: overrides the Instagram cover image (defaults to the last 1:1
# frame — leave unset until the 1:1 pipeline has run once and you can pick one).
# cover_image_path: "3_visualize/out/flood_stage_<storm>_<layer>_frames/frame_....png"

# Optional: hides the storm track/hurricane symbol until given time so it
# doesn't overlap the flood-timeline barplot (1:1 hourly animation).
# storm_track_start_time: "YYYY-MM-DD HH:MM:SS" # UTC
# Optional: same, but for the 4:5 Instagram barplot video. Falls back to
# storm_track_start_time above if omitted.
# storm_track_start_time_social: "YYYY-MM-DD HH:MM:SS" # UTC

storm_info:
  storm_name: "STORMNAME"
  storm_type_label: "Hurricane"   # e.g. "Hurricane", "Tropical Storm"
  storm_code: "alXXYYYY"
  storm_buffer: 250000
  shape_type: "buffered_storm_track"
  storm_best_track_url: "https://www.nhc.noaa.gov/gis/best_track/"
  stn_event: ~

# Spatial
# bbox in NAD83 (EPSG:4269) decimal degrees.
bbox:
  xmin: ~
  xmax: ~
  ymin: ~
  ymax: ~

proj: "+proj=..."

# Display timezone
timezone: "America/New_York"
timezone_abv: "ET"

# City labels
# The cities_n most populous places within the bbox are auto-labeled. Add a
# `cities` list of name/state pairs to force-include specific cities (e.g. ones
# below the population cutoff) regardless of the cutoff or bbox.
cities_n: 12
# cities:
#   - name: "Tallahassee"
#     state: "FL"

# Viz toggles
precip_grayscale: "FALSE"
flood_spike: "TRUE"

# Color palettes
pal_fs_blue:
  "Not flooded": "#d5d5d5"
  "Flood": "#4ecad7"
  "Moderate": "#17718E"
  "Major": "#003e6a"

pal_fs_red:
  "Not flooded": "#d5d5d5"
  "Flood": "#e5a000"
  "Moderate": "#F7513B"
  "Major": "#C917E8"

pal_percentile:
  - "#8c2d04"
  - "#cc9e02"
  - "#fee391"
  - "#C0C0C0"
  - "#80cdc1"
  - "#35978f"
  - "#045a8d"

pal_precip_blue:
  - "#c7f0f6"
  - "#92dce5"
  - "#5fc8d1"
  - "#38b1bc"
  - "#259db0"
  - "#1b88a1"
  - "#16738c"

pal_precip_grayscale:
  - "#E6E6E6"
  - "#CBCBCB"
  - "#B6B6B6"
  - "#A6A6A6"
  - "#979797"
  - "#858585"
  - "#6D6D6D"

# Plot config
# plot_shift / plot_width|height are relative to 0-1 canvas; re-tune
# whenever bbox area changes.
viz_config:
  width: 8
  height: 8
  dpi: 300
  state_outline_col: "white"
  major_cities_col: "gray60"
  major_cities_text_col: "gray50"
  streamgage_col: "gray30"
  storm_path_col: "black"
  state_inner_borders_col: "gray85"
  state_outer_lines_col: "gray80"
  bg_col: "white"
  ocean_col: "#f8fcfc"
  progress_bar_bg_col: "gray80"
  progress_bar_col: "gray45"
  x_mark: "black"
  load_font: "Source Sans 3"
  font_size_title: 16
  font_size: 14
  leg_font_size: 12
  plot_margin: 0.025
  plot_shift_x: -0.18
  plot_shift_y: -0.212
  plot_width: 1.39
  plot_height: 1.6
  rdg_icon_size: 0.014
  precip_raster_alpha: 0.6
  precip_col_alpha: 0.7
  precip_legend_key_width_cm: 3
  precip_legend_key_height_cm: 0.4
  state_inner_border_lw: 0.27
  state_outer_border_lw: 0.3
  storm_track_lw: 0.8
  storm_track_dot_size: 2
  hurricane_symbol_size: 0.035
  non_flooded_point_size: 1.25
  flooded_point_size: 2
  city_symbol_size: 1.75
  city_text_size: 3
  city_label_nudge_y: 50000
  flood_point_alpha: 0.75
  flood_legend_key_height_cm: 0.7
  dot_legend_size: 5
  rdg_legend_icon_size: 0.6
  decom_legend_size: 2
  legend_icon_col: "#aaaaaa"
  logo_width: 0.125
  storm_title_size: 31
  canvas_subtitle_size: 14
  canvas_legend_size: 12
  canvas_line_height: 0.027
  ocean_label_text: "Atlantic Ocean"
  ocean_label_x: 0.83
  ocean_label_y_offset: 0.32
  ocean_label_size: 10
  canvas_width: 16
  canvas_height: 9
  bar_width: 0.35
  bar_text_size: 4
  x_axis_buffer: 1.15
  progress_x: -0.05
  progress_y: -0.001
  progress_w: 1.1
  progress_h: 0.015
  # Flood spike geometry in projected units (meters); depends on proj above
  peak_height: 200000
  y_baseheight: 10000
  # Title/hold card background photo zoom + pan (the mp4's opening frame).
  # width/height oversize the photo past the 0-1 canvas so it gets cropped;
  # bigger = more zoomed in. x/y pan the crop (image's top-left corner).
  # title_bg_zoom multiplies width/height together on top of that (>1 zooms
  # in further, <1 zooms out); leave at 1 and tune width/height first.
  title_bg_x: -0.40
  title_bg_y: 3.6
  title_bg_width: 1.95
  title_bg_height: 6.4
  title_bg_zoom: 1
  # "<N> gages in flood stage" callout above the flood-timeline barplot.
  flood_stat_number_size: 20
  flood_stat_label_size: 13

# Canvas anchor points (0-1 coords, y from bottom). legend_box is the single
# knob for the whole legend stack. Move it to reposition the entire legend
# panel for a new storm. The internal layout (precip legend, gage icons, flood
# explainer, status bar) follows it via design-constant offsets defined in R.
# flood_stat positions the "<N> gages in flood stage" callout; if you move
# legend_box, check flood_stat doesn't collide with the legend's lowest item.
# Omitted anchors fall back to compose_frame()'s default_anchors.
anchors:
  legend_box: [0.0, 0.275]
  flood_stat: [0.013, 0.17]

# 4:5 social-media variant (e.g. Instagram feed post). Same builders/keys as
# viz_config above, just a taller canvas — width: 8, height: 10, re-tune
# plot_shift_x/y, plot_width/height, and legend_box below once the bbox area
# is set, the same way you would for viz_config.
viz_config_social:
  width: 8
  height: 10
  dpi: 300
  state_outline_col: "white"
  major_cities_col: "gray60"
  major_cities_text_col: "gray50"
  streamgage_col: "gray30"
  storm_path_col: "black"
  state_inner_borders_col: "gray85"
  state_outer_lines_col: "gray80"
  bg_col: "white"
  ocean_col: "#f8fcfc"
  progress_bar_bg_col: "gray80"
  progress_bar_col: "gray45"
  x_mark: "black"
  load_font: "Source Sans 3"
  font_size_title: 16
  font_size: 14
  leg_font_size: 12
  plot_margin: 0.025
  plot_shift_x: -0.18
  plot_shift_y: -0.212
  plot_width: 1.39
  plot_height: 1.6
  rdg_icon_size: 0.014
  precip_raster_alpha: 0.6
  precip_col_alpha: 0.7
  precip_legend_key_width_cm: 3
  precip_legend_key_height_cm: 0.4
  state_inner_border_lw: 0.27
  state_outer_border_lw: 0.3
  storm_track_lw: 0.8
  storm_track_dot_size: 2
  hurricane_symbol_size: 0.035
  non_flooded_point_size: 1.25
  flooded_point_size: 2
  city_symbol_size: 1.75
  city_text_size: 3
  city_label_nudge_y: 50000
  flood_point_alpha: 0.75
  flood_legend_key_height_cm: 0.7
  dot_legend_size: 5
  rdg_legend_icon_size: 0.6
  decom_legend_size: 2
  legend_icon_col: "#aaaaaa"
  logo_width: 0.125
  storm_title_size: 35
  canvas_subtitle_size: 19
  canvas_legend_size: 12
  canvas_line_height: 0.027
  ocean_label_text: "Atlantic Ocean"
  ocean_label_x: 0.83
  ocean_label_y_offset: 0.32
  ocean_label_size: 10
  canvas_width: 16
  canvas_height: 9
  bar_width: 0.35
  bar_text_size: 4
  bar_y_expand: 0.2
  x_axis_buffer: 1.15
  progress_x: -0.05
  progress_y: -0.001
  progress_w: 1.1
  progress_h: 0.015
  peak_height: 200000
  y_baseheight: 10000
  flood_stage_leg_x_nudge: 0
  # cover_zoom/cover_pan_x/cover_pan_y crop the IG cover card's background
  # frame; tune after picking a cover_image_path.
  cover_zoom: 1.58
  cover_pan_x: 0
  cover_pan_y: 0
  # "<N> gages in flood stage" callout above the flood-timeline barplot.
  flood_stat_number_size: 20
  flood_stat_label_size: 13

anchors_social:
  legend_box: [0.0, 0.275]
  flood_stat: [0.013, 0.17]

# Optional: Instagram legend card (slide 3) row positions/sizing. Omit to
# use build_legend_card()'s defaults (same values as below).
legend_card:
  text_size: 22
  dot_scale: 3
  rdg_scale: 0.9
  decom_scale: 3
  decom_stroke_scale: 3
  colorbar_scale: 2.5
  # gap added to explainer_x for the wrapped continuation lines
  # ("flow percentiles" / "of the flood")
  indent: 0.04
  # row y-positions, top to bottom (0 = canvas bottom, 1 = canvas top)
  rainfall_y: 0.94
  usgs_y: 0.84
  rdg_y: 0.75
  oos_y: 0.66
  spike_y: 0.58
  height_y: 0.50
  percentiles_y: 0.44
  color_y: 0.35
  flood_y: 0.29
  bottom_y: 0.25
  # row x-positions
  rainfall_label_x: 0.07
  rainfall_tick1_x: 0.425
  rainfall_colorbar_x: 0.46
  rainfall_tick2_x: 0.855
  icon_x: 0.10
  icon_label_x: 0.17
  explainer_x: 0.075
  bottom_image_x: 0.15
  bottom_image_width: 0.18
  bottom_image_height: 0.22
  bottom_key_x: 0.42
  bottom_key_y: 0.03
  bottom_key_width: 0.55
  bottom_key_height: 0.18
