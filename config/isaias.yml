# Per-storm and viz configuration for Tropical Storm Isaias (Oct 2026).
#
# Drafted while Isaias is still active/developing in the Gulf, before any
# landfall has occurred. See the date_start/date_end and landfall_time notes
# below before running this.
#
# Times are UTC. Display timezone is applied only in the final mapping
# step (see 3_visualize/src/builders/).

# Storm metadata
# Best-estimate 3-day developing window ending "today" (2026-10-07), since
# Stage IV precip is observed/analyzed data and can't extend into the
# forecast. Check actual Stage IV data availability and adjust date_end if
# the latest hours come back empty (there's typically some processing lag).
date_start: "2026-10-08"
date_end: "2026-10-12"

# Landfall time in UTC
landfall_time: "2026-10-10 01:30:00" # UTC

# Optional: hides the storm track/hurricane symbol until given time so it doesn't
# overlap the flood-timelinebarplot (1:1 hourly animation)
storm_track_start_time: "2026-10-09 00:00:00" # UTC, = Oct 8, 2026 19:00 CDT

# Optional: same, but for the 4:5 Instagram barplot video. Falls back to
# storm_track_start_time above if omitted.
storm_track_start_time_social: "2026-10-08 06:00:00" # UTC, = Oct 8, 2026 01:00 CDT

# Optional: overrides the Instagram cover image (defaults to the last 1:1 frame).
cover_image_path: "3_visualize/out/instagram_flood_stage_isaias_spike_frames/ig_frame_20261012T1500.png"

storm_info:
  storm_name: "ISAIAS"
  storm_type_label: "Hurricane"
  storm_code: "al092026"
  storm_buffer: 250000
  shape_type: "buffered_storm_track"
  storm_best_track_url: "https://www.nhc.noaa.gov/gis/best_track/"
  stn_event: ~

# Spatial
# bbox must be in NAD83 (EPSG:4269) decimal degrees.
# Covers the Bay of Campeche/Yucatan Channel (storm's recent position) north
# through the Gulf Coast states for context, even though the animation won't
# reach the coast. Re-tune plot_shift_x/y and plot_width/height below once
# you've seen a rendered frame.
bbox:
  xmin: -98.0
  xmax: -78.5
  ymin: 23.0
  ymax: 38.0

# Reused from helene.yml/edouard.yml — general Southeast/Gulf Albers projection.
proj: "+proj=aea +lat_0=23 +lon_0=-84 +lat_1=30 +lat_2=37 +x_0=0 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs"

# Display timezone
timezone: "America/Chicago"
timezone_abv: "CT"

# City labels
cities_n: 1
cities:
  - name: "New Orleans"
    state: "LA"
  - name: "Houston"
    state: "TX"
  - name: "Montgomery"
    state: "AL"
  - name: "Pensacola"
    state: "FL"
  - name: "Tampa"
    state: "FL"
  - name: "Dallas"
    state: "TX"
  - name: "Jackson"
    state: "MS"
  - name: "Atlanta"
    state: "GA"    
  - name: "Memphis"
    state: "TN"   
  - name: "Columbia"
    state: "SC" 
  - name: "Lexington"
    state: "KY" 

# Viz toggles
precip_grayscale: "FALSE"
flood_spike: "TRUE"

# Color palettes
pal_fs_blue:
  "Not flooded": "#c8c8c8"
  "Flood": "#4ecad7"
  "Moderate": "#17718E"
  "Major": "#003e6a"

pal_fs_red:
  "Not flooded": "#c8c8c8"
  "Flood": "#e5a000"
  "Moderate": "#F7513B"
  "Major": "#C917E8"

pal_percentile:
  - "#8c2d04"
  - "#cc9e02"
  - "#fee391"
  - "#C0C0C0"
  - "#80cdc1"
  - "#35978f"
  - "#045a8d"

pal_precip_blue:
  - "#c7f0f6"
  - "#92dce5"
  - "#5fc8d1"
  - "#38b1bc"
  - "#259db0"
  - "#1b88a1"
  - "#16738c"

pal_precip_grayscale:
  - "#E6E6E6"
  - "#CBCBCB"
  - "#B6B6B6"
  - "#A6A6A6"
  - "#979797"
  - "#858585"
  - "#6D6D6D"

# Plot config
# plot_margin / plot_shift_x|y / plot_width|height are relative to the
# 0-1 canvas; re-tune whenever bbox area changes. Starting values below are
# copied from edouard.yml (another Gulf-focused storm) rather than Helene's
# Atlantic-tuned ones, but Isaias's bbox is larger, so expect to retune.
viz_config:
  width: 8
  height: 8
  dpi: 300
  state_outline_col: "white"
  major_cities_col: "gray60"
  major_cities_text_col: "gray50"
  streamgage_col: "gray30"
  storm_path_col: "black"
  state_inner_borders_col: "gray85"
  state_outer_lines_col: "gray80"
  bg_col: "white"
  ocean_col: "#f8fcfc"
  progress_bar_bg_col: "gray80"
  progress_bar_col: "gray45"
  x_mark: "black"
  load_font: "Source Sans 3"
  font_size_title: 16
  font_size: 14
  leg_font_size: 12
  plot_margin: 0.025
  plot_shift_x: -0.22
  plot_shift_y: -0.208
  plot_width: 1.39
  plot_height: 1.6
  rdg_icon_size: 0.014
  precip_raster_alpha: 0.6
  precip_col_alpha: 0.7
  precip_legend_key_width_cm: 3
  precip_legend_key_height_cm: 0.4
  state_inner_border_lw: 0.27
  state_outer_border_lw: 0.3
  storm_track_lw: 0.8
  storm_track_dot_size: 2
  hurricane_symbol_size: 0.035
  non_flooded_point_size: 1.25
  flooded_point_size: 2
  city_symbol_size: 1.75
  city_text_size: 3
  city_label_nudge_y: 15000
  flood_point_alpha: 0.75
  flood_legend_key_height_cm: 0.7
  dot_legend_size: 5
  rdg_legend_icon_size: 0.6
  decom_legend_size: 2
  legend_icon_col: "#aaaaaa"
  logo_width: 0.125
  storm_title_size: 31
  canvas_subtitle_size: 14
  canvas_legend_size: 12
  canvas_line_height: 0.027
  ocean_label_text: "Gulf of America"
  ocean_label_x: 0.58
  ocean_label_y_offset: 0.19
  ocean_label_size: 10
  canvas_width: 16
  canvas_height: 9
  bar_width: 0.35
  bar_text_size: 4
  x_axis_buffer: 1.15
  progress_x: -0.05
  progress_y: -0.001
  progress_w: 1.1
  progress_h: 0.015
  # Flood spike geometry in projected units (meters); depends on proj above
  peak_height: 200000
  y_baseheight: 10000
  title_bg_x: -0.42
  title_bg_y: 3.47
  title_bg_width: 1.95
  title_bg_height: 6.4

# Canvas anchor points (0-1 coords, y from bottom). legend_box is the single
# knob for the whole legend stack. Move it to reposition the entire legend
# panel for a new storm. The internal layout (precip legend, gage icons, flood
# explainer, status bar) follows it via design-constant offsets defined in R.
anchors:
  legend_box: [-0.009, 0.36]

# 4:5 social-media variant (e.g. Instagram feed post). Same builders/keys as
