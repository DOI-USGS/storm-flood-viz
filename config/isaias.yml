# Instagram legend card (slide 3) row positions and sizing. Copied from
# helene.yml's tuned values as a starting point (R defaults in
# build_legend_card.R are untuned — e.g. rdg_scale defaults to 0.9, too large).
legend_card:
  text_size: 26
  dot_scale: 3
  rdg_scale: 0.55
  decom_scale: 3
  decom_stroke_scale: 3
  colorbar_scale: 2.5
  indent: 0.04
  rainfall_y: 0.94
  usgs_y: 0.84
  rdg_y: 0.75
  oos_y: 0.66
  spike_y: 0.58
  height_y: 0.51
  percentiles_y: 0.45
  color_y: 0.38
  flood_y: 0.32
  bottom_y: 0.25
  rainfall_label_x: 0.07
  rainfall_tick1_x: 0.425
  rainfall_colorbar_x: 0.43
  rainfall_tick2_x: 0.855
  icon_x: 0.10
  icon_label_x: 0.17
